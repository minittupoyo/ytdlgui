name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: windows-x86_64
            runner: windows-latest
            target: windows
            extra_args: ""
          - asset: macos-arm64
            runner: macos-latest
            target: macos
            extra_args: "--arch arm64"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        env:
          EXPECTED_TAG: v${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag must be $EXPECTED_TAG to match pyproject.toml; got $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Build ${{ matrix.asset }}
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}
          build-version: ${{ steps.version.outputs.value }}
          extra-args: ${{ matrix.extra_args }}

      - name: Name release archive
        shell: bash
        run: |
          mkdir -p release
          cp "${{ steps.build.outputs.archive-path }}" "release/ytdlgui-${{ steps.version.outputs.value }}-${{ matrix.asset }}.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: release/*.zip
          archive: false
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read project version
        id: version
        run: |
          VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.zip --title "$TAG" --generate-notes
