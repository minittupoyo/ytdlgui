name: Build desktop apps

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: windows-x86_64
            runner: windows-latest
            target: windows
            extra_args: ""
          - asset: macos-arm64
            runner: macos-latest
            target: macos
            extra_args: "--arch arm64"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.asset }}
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}
          build-version: ${{ steps.version.outputs.value }}
          extra-args: ${{ matrix.extra_args }}

      - name: Name build archive
        shell: bash
        run: |
          mkdir -p release
          cp "${{ steps.build.outputs.archive-path }}" "release/ytdlgui-${{ steps.version.outputs.value }}-${{ matrix.asset }}.zip"

      - name: Upload build archive
        uses: actions/upload-artifact@v7
        with:
          name: ytdlgui-${{ matrix.asset }}
          path: release/*.zip
          archive: false
          if-no-files-found: error
