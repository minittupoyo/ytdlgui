name: Build Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build Windows app
        run: uv run flet build windows --yes

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdlgui-windows
          path: build/windows
